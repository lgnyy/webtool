function HTML_Load(){
	$("txtAreaInput").value = "";
	$("txtAreaOutput").value = "";
	
	loadScript(["jsc/tables/cp936.js", "jsc/tables/gbk-added.js", "jsc/tables/gb18030-ranges.js", "jsc/iconv-lite.js"]);

}

function btnBase64Encode_onclick() {
	try{
		var data = $("txtAreaInput").value;
		var str = base16Decode(data, {charset:'utf-8'});
		$("txtAreaOutput").value = window.btoa(unescape(encodeURIComponent(str)));
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}
}

function btnBase64Decode_onclick() {
	try{
		var data = $("txtAreaInput").value;
		var str = decodeURIComponent(escape(window.atob(data)));
		$("txtAreaOutput").value = base16Encode(str);
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}	
}

function btnBase16Encode_onclick() {
	try{
		var index = $("selectCodepage").selectedIndex;
	    var encoding = ['GBK','GB18030','UTF8','UCS-2LE','UCS-2BE','UCS-2BE'][index];
		var data = $("txtAreaInput").value;
		
		$("txtAreaOutput").value = data.base16Encode({charset: encoding});
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}	
}

function btnBase16Decode_onclick() {
	try{
		var index = $("selectCodepage").selectedIndex;
	    var encoding = ['GBK','GB18030','UTF8','UCS-2LE','UCS-2BE','UCS-2BE'][index];
		var data = $("txtAreaInput").value;
		if (index === 4){
			data = data.replace(new RegExp('5C' + '(?=(?:..)*$)', 'g'), '');
		}
		
		$("txtAreaOutput").value = data.base16Decode({charset: encoding});
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}	
}

function btnJSONString_onclick() {
	var val = $("txtAreaInput").value;
	$("txtAreaOutput").value = JSON.stringify(val);
}

function btnEval_onclick() {
	var val = $("txtAreaInput").value;
	var s = eval(val); // 局部
	if (s){
		$("txtAreaOutput").value = s;
	}
}
function btnExecScript_onclick() {
	var val = $("txtAreaInput").value;
	execScript(val); // execScript(IE); window.eval(code)
}


function btnReverse_onclick() {
	try{
		var val = $("txtAreaInput").value;
		$("txtAreaInput").value = val.match(/../g).reverse().join('');
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}	
}

function btnRemoveSpace_onclick() {
	var val = $("txtAreaInput").value;
	$("txtAreaInput").value = val.replace(/ /g, "").replace(/\t/g, "");
}

function btnRemoveEnter_onclick() {
	var val = $("txtAreaInput").value;
	$("txtAreaInput").value = val.replace(new RegExp("\r\n|\n", "g"), "");
}

function btnRemoveHexX_onclick() {
	var x = $("txtX").value;
	var val = $("txtAreaInput").value;
	var reg = new RegExp(x.replace("\\", "\\\\"), "g");
	$("txtAreaInput").value = val.replace(reg, ""); // /\\x/g
}

function btnAddHexX_onclick() {
	var x = $("txtX").value
	var val = $("txtAreaInput").value;
	$("txtAreaInput").value = x + val.match(/../g).join(x);
}

function btnAddHexN_onclick() {
	var val = $("txtAreaInput").value;
	var ar = [];
	for (var i=0; i<val.length; i+=64){
		ar.push(val.substr(i,64));
	}
	$("txtAreaInput").value = ar.join("\n");
}


function JS_DecodeTLV(s){
	var rev = function(val){ return val.match(/../g).reverse().join(''); }
	var a = new Array();

	var j=0;
	for (var i=0; i<s.length; ){
		var tag = s.substr(i, 4<<1);
		var len = parseInt(rev(s.substr(i+(4<<1), 4<<1)), 16);

		if (!((len >= 0) && (len < (s.length-i) << 1))){
			Debug.writeln("err pos:" + i + ", err data:" + s.substr(i, 8<<1));
			return a;
		}
		var data = s.substr(i+(8<<1), len<<1);

		a[j++] = new Array(tag, data);
		i += ((8 + len) << 1);
	}
	return a;
}

function btnReadFile_onclick(){
	if (typeof(FileReader) === "undefined"){
		alert("您的浏览器不支持FileReader");
		return;
	}

	var file = $("txtFileInput");
	if (file.files.length === 0){
		file.click();
		if (file.files.length === 0){
			return;
		}
	}

	var reader = new FileReader();
	if ( $("selectInputCode").selectedIndex === 0){
		reader.readAsArrayBuffer(file.files[0]);
		reader.onload = function () {
			var bytes = new Uint8Array(this.result);
			var len = bytes.byteLength;
			var binary = "";
			for (var i = 0; i < len; i++) {
				var n = bytes[i];
				binary += (((n < 16) && ('0' + n.toString(16))) || n.toString(16));
			}
			$("txtAreaInput").value = binary.toUpperCase();
		};
	}else{
		reader.readAsText(file.files[0]);
		reader.onload = function(){ $("txtAreaInput").value = reader.result; }
	}
}

function btnAreaSwap_onclick(){
	var s = $("txtAreaInput").value;
	$("txtAreaInput").value = $("txtAreaOutput").value;
	$("txtAreaOutput").value = s;
}

function btnWriteFile_onclick(){
	var requestFileSystem = window.requestFileSystem||window.webkitRequestFileSystem;
    if (!requestFileSystem){
		alert("您的浏览器不支持RequestFileSystem");
		return;
	}
	
	var title = $("txtFileOutput").value;
	var bb;
	if ( $("selectOutputCode").selectedIndex === 0){
		var str = $("txtAreaOutput").value;
		var data = new Uint8Array(str.length / 2);
		for (var i=0,j=0; i<str.length; i+=2){
			data[j++] = parseInt(str.substr(i,2),16);
		}
		bb = new Blob([data], {type : "application/octet-stream"});
	}else{
		bb = new Blob([$("txtAreaOutput").value], {type : 'text/html'});
	}
	
	// 存储路径: 'C:\Users\ljc\AppData\Local\Microsoft\Edge\User Data\Default\File System'
	// 不能像对普通文件那样直接操作它们的真身，只能用JavaScrip。
	requestFileSystem(window.PERSISTENT,1024*1024,function(filesystem){ // TEMPORARY
		filesystem.root.getFile(title, { create: true }, function (fileEntry) { 
			fileEntry.createWriter(function (fileWriter) { 
				fileWriter.seek(fileWriter.length); 
				fileWriter.onwriteend = function (e) { 
					Debug.writeln("写文件（" + title +"）成功。");
					console.log('Write completed.'); 
				}; 
				fileWriter.onerror = function (e) { 
					console.log('Write failed: ' + e.toString()); 
				}; 
				fileWriter.write(bb); 
			}, errorHandler); 
		}, errorHandler); 
	},errorHandler);
	
	function errorHandler(e){
		Debug.writeln("Call FileSystem Fail: " + e.code);
	}
}
		
function btnDownFile_onclick(){
	if (typeof(Blob) === "undefined"){
		alert("您的浏览器不支持Blob");
		return;
	}

	var title = $("txtFileOutput").value;
	var bb;
	if ( $("selectOutputCode").selectedIndex === 0){
		var str = $("txtAreaOutput").value;
		var data = new Uint8Array(str.length / 2);
		for (var i=0,j=0; i<str.length; i+=2){
			data[j++] = parseInt(str.substr(i,2),16);
		}
		bb = new Blob([data], {type : "application/octet-stream"});
	}else{
		bb = new Blob([$("txtAreaOutput").value], {type : 'text/html'});
	}
	var a = document.createElement('a');
	if ((typeof a.download !== 'undefined')){
		a.setAttribute('download', title);
		a.setAttribute('href', URL.createObjectURL(bb));	
		a.click();
	}else{
		a.target = '_blank';
        var reader = new FileReader();
        reader.onload = function(e) {
			a.href = this.result;
			a.click();
		}
        reader.readAsDataURL(bb);
	}
}
