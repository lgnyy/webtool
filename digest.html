<HTML xmlns:st1>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<link rel="stylesheet" href="theme.css">
	<script src="js/common.js" language="javascript"></script>
	<script src="jsc/base16.js" language="javascript"></script>
	<script language="javascript" id="clientEventHandlersJS">
<!--


function HTML_Load(){
	$("txtAreaInput").value = "";
	$("txtAreaOutput").value = "";

	loadScript(["jsp/sm3.js"]);
}

function HTML_Unload(){
}

function btnDigest_onclick() {

	function degist(hashName, hashData) {
		if (hashName === 'SM3'){
			$("txtAreaOutput").value = sm3(hashData);
		}else{
			window.crypto.subtle.digest(hashName, hashData).then(function(r){
				$("txtAreaOutput").value = jsc.base16.encode(new Uint8Array(r)); 
			}, function(e){ // 兼容旧浏览器，这里不调用catch
				Debug.writeln( "error message:" + e.message );
			});
		}
	}
		
	try{
		var element = $("selectDigestName");
		var algName = element.options[element.selectedIndex].text;
		var fileName = $("txtFile").value;
		var hashData = $("txtAreaInput").value;
		
		if (!fileName){
			var buf = new Uint8Array(jsc.base16.decode(hashData, {output:'array'}));
			degist(algName, buf);
		}else{
			var reader = new FileReader();
			reader.readAsArrayBuffer($("txtFile").files[0]);
			reader.onload = function () {
				degist(algName, new Uint8Array(this.result));
				//$("txtAreaInput").value = binary.toUpperCase();
			}
		}
	}catch(e){
		Debug.writeln( "error message:" + e.message );
	}	
}

//-->
	</script>
	<BODY id="DigestDlg" onload="HTML_Load()" onunload="HTML_Unload()">
		<TABLE WIDTH="900px" align="center">
			<TR>
				<TD align="right" height="23">&nbsp;
				</TD>
			</TR>
			<TR height="75" WIDTH="100%">
				<TD vAlign="bottom" align="left">
					<form method="post" id="formUpload" enctype="multipart/form-data" target="frameFile" action="/softalg">
						&nbsp;&nbsp;&nbsp;&nbsp;算法名称：
						<SELECT id="selectDigestName" name="selectDigestName">
							<OPTION>SHA-1</OPTION>
							<OPTION>SHA-256</OPTION>
							<OPTION>SHA-384</OPTION>
							<OPTION>SHA-512</OPTION>
							<OPTION selected>SM3</OPTION>
						</SELECT>
						&nbsp;&nbsp;&nbsp;文件：<INPUT id="txtFile" type="file" size="46" name="txtFile">
					</form>
					<P>&nbsp;&nbsp;&nbsp; <INPUT id="btnDigest" type="button" value="         计 算         " name="btnDigest" onclick="return btnDigest_onclick()"
							size="200"></P>
					<P><TEXTAREA id="txtAreaInput" name="txtAreaInput" rows="10" cols="120">
						</TEXTAREA>
						<TEXTAREA id="txtAreaOutput" name="txtAreaOutput" rows="6" cols="120">
						</TEXTAREA></P>
				</TD>
			</TR>
			<TR WIDTH="100%">
				<TD align="left">
					<br><b>摘要前缀：</b>
					<pre>MD5:     3020300c06082a864886f70d020505000410
SHA-1:   3021300906052b0e03021a05000414
SHA-256: 3031300d060960864801650304020105000420
SHA-384: 3041300d060960864801650304020205000430
SHA-512: 3051300d060960864801650304020305000440</pre>
				</TD>
			</TR>
		</TABLE>
	</BODY>
</HTML>
